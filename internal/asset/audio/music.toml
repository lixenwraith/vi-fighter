# Built-in music patterns. A step is a sixteenth, sixteen to a bar; a 32-step
# pattern is two. vel, prob and humanize are 0..1; deg is a scale degree and oct
# an octave above the harmony root. A pattern named fill_* joins the slot-2 fill
# bank. The tiers that draw from the rest name them in internal/parameter/music.go.

# Rhythm: slot 0. Kick stays the first track, so a build-up reveals it first.

[[pattern]]
name = "beat_basic"
desc = "Calm: four-on-the-floor kick under offbeat hats"
steps = 16
[[pattern.track]]
instr = "kick"
event = [{ pos = 0, vel = 0.9 }, { pos = 4, vel = 0.9 }, { pos = 8, vel = 0.9 }, { pos = 12, vel = 0.9 }]
[[pattern.track]]
instr = "hihat"
humanize = 0.5
event = [{ pos = 2, vel = 0.4 }, { pos = 6, vel = 0.4 }, { pos = 10, vel = 0.4 }, { pos = 14, vel = 0.4 }]

