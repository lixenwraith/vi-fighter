humanize = 0.4
event = [{ pos = 4, vel = 0.9 }, { pos = 12, vel = 0.9 }, { pos = 14, vel = 0.3, prob = 0.4 }]
[[pattern.track]]
instr = "hihat"
humanize = 0.7
event = [
  { pos = 0, vel = 0.5 }, { pos = 3, vel = 0.35 }, { pos = 5, vel = 0.35 }, { pos = 7, vel = 0.35 },
  { pos = 10, vel = 0.5 }, { pos = 12, vel = 0.35 }, { pos = 14, vel = 0.35 }
]

[[pattern]]
name = "beat_halftime"
desc = "Halftime: one snare a bar, room between the hits"
steps = 16
