event = [{ pos = 4, vel = 0.2, prob = 0.3 }, { pos = 9, vel = 0.2, prob = 0.3 }, { pos = 14, vel = 0.2, prob = 0.3 }]

[[pattern]]
name = "beat_breaks"
desc = "Breakbeat kick and snare over a seven-onset hat"
steps = 16
[[pattern.track]]
