# Built-in music patterns. A step is a sixteenth, sixteen to a bar; a 32-step
# pattern is two. vel, prob and humanize are 0..1; deg is a scale degree and oct an
# octave above the harmony root. role, groups and tiers place a pattern in the drawn
# music: a group shares one bass figure and kick feel, so whatever it draws at any
# tier follows what it drew before. A pattern without tiers plays only when placed.

# rolling: four-on-the-floor kick under the psytrance k-b-b-b sixteenth bass.

[[pattern]]
name = "beat_basic"
desc = "Four-on-the-floor kick under offbeat hats"
steps = 16
role = "rhythm"
groups = ["rolling", "offbeat"]
tiers = ["calm"]
[[pattern.track]]
instr = "kick"
event = [{ pos = 0, vel = 0.9 }, { pos = 4, vel = 0.9 }, { pos = 8, vel = 0.9 }, { pos = 12, vel = 0.9 }]
[[pattern.track]]
instr = "hihat"
humanize = 0.5
event = [{ pos = 2, vel = 0.4 }, { pos = 6, vel = 0.4 }, { pos = 10, vel = 0.4 }, { pos = 14, vel = 0.4 }]

