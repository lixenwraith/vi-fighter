instr = "hihat"
humanize = 0.6
event = [
  { pos = 0, vel = 0.55 }, { pos = 1, vel = 0.3 }, { pos = 2, vel = 0.55 }, { pos = 3, vel = 0.3 },
  { pos = 4, vel = 0.55 }, { pos = 5, vel = 0.3 }, { pos = 6, vel = 0.55 }, { pos = 7, vel = 0.3 },
  { pos = 8, vel = 0.55 }, { pos = 9, vel = 0.3 }, { pos = 10, vel = 0.55 }, { pos = 11, vel = 0.3 },
  { pos = 12, vel = 0.55 }, { pos = 13, vel = 0.3 }, { pos = 14, vel = 0.55 }, { pos = 15, vel = 0.3 }
]
[[pattern.track]]
instr = "snare"
humanize = 0.4
event = [{ pos = 4, vel = 0.9 }, { pos = 12, vel = 0.9 }, { pos = 7, vel = 0.35, prob = 0.35 }, { pos = 15, vel = 0.35, prob = 0.35 }]
[[pattern.track]]
instr = "clap"
humanize = 0.3
event = [{ pos = 12, vel = 0.6 }]

# Melody: slot 1. Degrees resolve through the scale; follow_chord adds the bar's chord root.

[[pattern]]
name = "melody_bassline"
desc = "Rolling offbeat bass following the chord"
steps = 16
[[pattern.track]]
instr = "bass"
follow_chord = true
humanize = 0.15
event = [
  { pos = 1, vel = 0.85, dur = 1 }, { pos = 2, vel = 0.7, dur = 1 }, { pos = 3, vel = 0.7, dur = 1 },
  { pos = 5, vel = 0.85, dur = 1 }, { pos = 6, vel = 0.7, dur = 1 }, { pos = 7, vel = 0.7, dur = 1 },
  { pos = 9, vel = 0.85, dur = 1 }, { pos = 10, vel = 0.7, dur = 1 }, { pos = 11, vel = 0.7, dur = 1 },
  { pos = 13, vel = 0.85, dur = 1 }, { pos = 14, vel = 0.7, dur = 1 }, { pos = 15, vel = 0.7, dur = 1 }
]

