# Fills: slot 2. The sequencer swaps one in on the last bar of each eight-bar phrase.

[[pattern]]
name = "fill_snare_roll"
desc = "Fill: snare crescendo across the bar"
steps = 16
[[pattern.track]]
instr = "kick"
event = [{ pos = 0, vel = 0.9 }]
[[pattern.track]]
instr = "snare"
humanize = 0.5
event = [
  { pos = 0, vel = 0.3 }, { pos = 1, vel = 0.34299999999999997 }, { pos = 2, vel = 0.386 }, { pos = 3, vel = 0.429 },
  { pos = 4, vel = 0.472 }, { pos = 5, vel = 0.5149999999999999 }, { pos = 6, vel = 0.558 }, { pos = 7, vel = 0.601 },
  { pos = 8, vel = 0.6439999999999999 }, { pos = 9, vel = 0.6869999999999999 }, { pos = 10, vel = 0.73 }, { pos = 11, vel = 0.7729999999999999 },
  { pos = 12, vel = 0.8160000000000001 }, { pos = 13, vel = 0.859 }, { pos = 14, vel = 0.9019999999999999 }, { pos = 15, vel = 0.9449999999999998 }
]

