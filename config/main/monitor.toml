# Parallel region for player lifecycle, global state and reset

# Boot: the world starts with no cursor, so spawning one is a deliberate step
[states.MonitorBoot]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventCursorSpawnRequest", payload = { center = true } },
]
transitions = [
    { trigger = "EventCursorSpawned", target = "MonitorArm", capture_vars = { entity = "player_entity" } },
    { trigger = "EventCursorSpawnFailed", target = "MonitorBootRetry" },
]

[states.MonitorBootRetry]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "MonitorBoot", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# Arm the spawned cursor and open gameplay; the reset gate needs a non-zero start
[states.MonitorArm]
parent = "Root"
on_enter = [
    { action = "EmitEvent", event = "EventHeatSetRequest", payload = { entity = 0, value = 10 }, payload_vars = { entity = "player_entity" } },
    { action = "EmitEvent", event = "EventEnergySetRequest", payload = { entity = 0, value = 100 }, payload_vars = { entity = "player_entity" } },
    { action = "SpawnRegion", region = "main", initial_state = "MainSpawnGold" },
]
transitions = [
    { trigger = "Tick", target = "MonitorActive" },
]

[states.MonitorCycle]
parent = "Root"
transitions = [
    { trigger = "Tick", target = "MonitorGlobalReset", guard = "VarEquals", guard_args = { var = "level_failed", value = 1 } },
]

[states.MonitorWarmup]
parent = "MonitorCycle"
transitions = [
    { trigger = "Tick", target = "MonitorActive", guard = "Or", guard_args = { guards = [
        { name = "StatusIntCompare", args = { key = "heat.current", op = "gt", value = 0 } },
        { name = "StatusIntCompare", args = { key = "energy.current", op = "neq", value = 0 } },
    ] } },
]

[states.MonitorActive]
parent = "MonitorCycle"
transitions = [
    { trigger = "EventHeatBurst", target = "MonitorHeatBurst", capture_vars = { entity = "burst_entity" } },
    { trigger = "Tick", target = "MonitorGlobalReset", guard = "StatusBoolEquals", guard_args = { key = "session.all_defeated", value = true } },
]

[states.MonitorHeatBurst]
parent = "MonitorCycle"
on_enter = [
    { action = "EmitEvent", event = "EventCleanerSweepingRequest", payload = { entity = 0 }, payload_vars = { entity = "burst_entity" } },
]
transitions = [
    { trigger = "Tick", target = "MonitorActive" },
]

[states.MonitorGlobalReset]
parent = "Root"
on_enter = [
    # Retire the players first: level setup then sees no cursor to reflow
    { action = "EmitEvent", event = "EventCursorDespawnRequest", payload = { all = true } },
    # Cancel active sequences
    { action = "EmitEvent", event = "EventGoldCancel" },
    { action = "EmitEvent", event = "EventGrayoutEnd" },
    { action = "EmitEvent", event = "EventDrainResume" },
    # Cancel species entities
    { action = "EmitEvent", event = "EventQuasarCancelRequest" },
    { action = "EmitEvent", event = "EventStormCancelRequest" },
    { action = "EmitEvent", event = "EventSwarmCancelRequest" },
    # Reset tracking
    { action = "ResetKillVars" },
    { action = "EmitEvent", event = "EventCycleDamageMultiplierReset" },
    { action = "SetVar", payload = { name = "level_failed", value = 0 } },
    # Terminate all gameplay regions
    { action = "TerminateRegion", region = "quasar" },
    { action = "TerminateRegion", region = "storm" },
    { action = "TerminateRegion", region = "tower" },
    { action = "TerminateRegion", region = "main" },
    # Reset visual cue
    { action = "EmitEvent", event = "EventStrobeRequest", payload = { color = { r = 255, g = 0, b = 0 }, intensity = 1.0, duration_ms = 250 } },
    # Level setup: map = viewport, cropped, clear entities
    { action = "EmitEvent", event = "EventLevelSetup", payload = { width = 0, height = 0, clear_entities = true, crop_on_resize = true } },
]
transitions = [
    { trigger = "Tick", target = "MonitorBoot" },
]
