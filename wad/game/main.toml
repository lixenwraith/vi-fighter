# Main region: gold cycle with escalation to quasar

[states.MainCycle]
parent = "Root"
on_exit = [
    { action = "EmitEvent", event = "EventGoldCancel" },
]
transitions = [
    # FSM sees the crossing before MetaSystem increments the shared counter, so
    # nine prior defeats plus this event selects its causal participant.
    { trigger = "EventDrainDefeated", target = "MainEscalate", guard = "StatusIntCompare", guard_args = { key = "kills.drain", op = "gte", value = 9 }, capture_vars = { entity = "fuse_owner" } },
]

# --- Gold Spawn ---

[states.MainSpawnGold]
parent = "MainCycle"
on_enter = [
    { action = "EmitEvent", event = "EventGoldSpawnRequest" },
]
transitions = [
    { trigger = "EventGoldSpawned", target = "MainGoldActive" },
    { trigger = "EventGoldSpawnFailed", target = "MainSpawnGoldRetry" },
]

[states.MainSpawnGoldRetry]
parent = "MainCycle"
transitions = [
    { trigger = "Tick", target = "MainSpawnGold", guard = "StateTimeExceeds", guard_args = { ms = 100 } },
]

# --- Gold Active ---

[states.MainGoldActive]
parent = "MainCycle"
transitions = [
    { trigger = "EventGoldCompleted", target = "MainGoldCompleted", capture_vars = { entity = "reward_entity" } },
    { trigger = "EventGoldTimeout", target = "MainGoldTimeout" },
    { trigger = "EventGoldDestroyed", target = "MainGoldDestroyed" },
]

[states.MainGoldCompleted]
parent = "MainCycle"
on_enter = [
    { action = "EmitEvent", event = "EventHeatAddRequest", payload = { entity = 0, delta = 100 }, payload_vars = { entity = "reward_entity" } },
    { action = "EmitEvent", event = "EventEnergyAddRequest", payload = { entity = 0, delta = 1000, type = 1 }, payload_vars = { entity = "reward_entity" } },
]
transitions = [
    { trigger = "Tick", target = "MainDecayWait" },
]

[states.MainGoldTimeout]
parent = "MainCycle"
transitions = [
    { trigger = "Tick", target = "MainDecayWait" },
]

[states.MainGoldDestroyed]
parent = "MainCycle"
transitions = [
    { trigger = "Tick", target = "MainDecayWait" },
]

# --- Decay Cycle ---

[states.MainDecayWait]
parent = "MainCycle"
transitions = [
    { trigger = "Tick", target = "MainDecayWave", guard = "StateTimeExceeds", guard_args = { ms = 5000 } },
]

[states.MainDecayWave]
parent = "MainCycle"
on_enter = [
    { action = "EmitEvent", event = "EventDecayWave" },
]
transitions = [
    { trigger = "Tick", target = "MainSpawnGold", guard = "StateTimeExceeds", guard_args = { ms = 5000 } },
]

# --- Escalation ---

[states.MainEscalate]
parent = "Root"
on_exit = [
    # Reset after the triggering EventDrainDefeated has reached MetaSystem.
    { action = "ResetStatusInt", payload = { key = "kills.drain" } },
]
on_enter = [
    { action = "SpawnRegion", region = "quasar", initial_state = "QuasarFuse" },
    { action = "PauseRegion", region = "main" },
]
transitions = [
    { trigger = "Tick", target = "MainSpawnGold" },
]
