name: Release

# The schedule moves the nightly prerelease; a v* tag drafts a stable release that
# a person publishes. Both build the same archives.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.27.1'

jobs:
  artifacts:
    name: Build downloadable artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Refresh generated registries
        shell: bash
        run: |
          go generate ./internal/event ./internal/manifest
          # A release's binaries must be what its source archive builds.
          if [ "$GITHUB_REF_TYPE" = tag ]; then git diff --exit-code; fi

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          label=nightly
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=${GITHUB_REF_NAME#v}; fi
          mkdir -p dist stage/linux-amd64 stage/linux-amd64-headless \
            stage/freebsd-amd64 stage/web

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o stage/linux-amd64/vif ./cmd/vif
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags=vif_headless -ldflags='-s -w' \
            -o stage/linux-amd64-headless/vif ./cmd/vif
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o stage/freebsd-amd64/vif ./cmd/vif
          GOOS=js GOARCH=wasm \
            go build -trimpath -tags=vif_noaudio -ldflags='-s -w' \
            -o stage/web/vif.wasm ./cmd/vif

          for target in linux-amd64 linux-amd64-headless freebsd-amd64; do
            cp README.md LICENSE "stage/$target/"
            tar -C "stage/$target" -czf "dist/vi-fighter-$label-$target.tar.gz" .
          done
          cp -R web/. stage/web/
          tar -C stage/web -czf "dist/vi-fighter-$label-web.tar.gz" .

          # One archive rather than a copy in each target's: the wad is the same
          # bytes on every platform. The Makefile owns what is in it, so the
          # release and make install-config cannot drift.
          make wad-archive WAD_ARCHIVE="dist/vi-fighter-$label-wad.tar.gz"

          # The source archive distributions build from. It is uploaded once, so
          # its bytes and checksum never change the way GitHub's generated ones may.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git archive --format=tar.gz --prefix="vi-fighter-$label/" \
              -o "dist/vi-fighter-$label.tar.gz" "$GITHUB_REF_NAME"
          fi

          (cd dist && sha256sum vi-fighter-* > SHA256SUMS)

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  image:
    name: Publish headless container
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push headless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=nightly
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  release:
    name: Publish release assets
    needs: [artifacts, image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: nightly-release
          path: dist

      - name: Draft the tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "vi-fighter $GITHUB_REF_NAME" \
            --notes "Release of ${GITHUB_SHA}. vi-fighter-${GITHUB_REF_NAME#v}.tar.gz is the source archive; SHA256SUMS covers every asset."

      - name: Move nightly tag and publish assets
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          notes="Automated build of ${GITHUB_SHA}. The Linux server archive and GHCR image use the vif_headless profile."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly --title 'Nightly build' --notes "$notes" --prerelease
          else
            gh release create nightly dist/* --target "$GITHUB_SHA" \
              --title 'Nightly build' --notes "$notes" --prerelease
          fi
