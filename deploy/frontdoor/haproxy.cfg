# The front door: ten sessions behind one public port.
#
# NOT THE DEPLOYED PATH. The proof of concept reaches a session on its own port
# and this is kept as the worked alternative for the routing exploration that
# follows it (fleet plan H8). Taking it means adding `-name ${SESSION_ID}` back to
# the session manifest's args — without that a session answers to every dial, and
# with it a session refuses every dial that does not name it, so the two halves
# move together or not at all.
#
# The coordinator speaks first, so a router in front of several sessions cannot
# learn which one a connection wants from the network alone. What it can read is
# the routing frame the dialer sends before the handshake: a 12-byte header and
# then the session's name. That is fixed-offset and it is the whole of what this
# needs — no reload, no per-session file, one map entry per live session.
#
# The frame is forwarded, not consumed: the session verifies the name itself, so a
# stale or misrouted connection is refused rather than dropped into another match.
#
# Substitute 192.0.2.20 for the node's own address and NAME_BYTES for the length of
# the names the allocator issues (32 for `openssl rand -hex 16`). Both are literal
# here because the map lookup is fixed-width by construction.
#
# See doc/kube_docker_deploy.md §11, including what this costs: the pod sees this
# proxy's address instead of the player's, so the per-address admission limiter
# becomes one budget for the whole fleet.

global
    log /dev/log local0
    # The allocator adds and removes map entries here, as the session it created
    # becomes reachable and when it ends. Admin level, owner-only.
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m
    # After the splice, this is the one that matters: a match runs for as long as
    # people play it, and it must not be the proxy that decides otherwise. Above
    # the Job's activeDeadlineSeconds, so the session ends its own connections.
    timeout tunnel 5h

frontend vif
    bind :7777
    # Long enough for a slow link to deliver 44 bytes, short enough that a
    # connection holding the inspection open is not free.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len ge 44 }
    # 12-byte frame header, then NAME_BYTES of session name.
    use_backend %[req.payload(12,32),map_str(/etc/haproxy/vif-sessions.map)]
    default_backend vif-unrouted

# One backend per NodePort rather than per session: the ports are the fixed
# resource the API server enforces, and the map is what moves. The allocator writes
# `set map /etc/haproxy/vif-sessions.map <name> vif-<n>` for the port it placed the
# session on, and `del map` when the Job completes.
backend vif-0
    server s0 192.0.2.20:31700
backend vif-1
    server s1 192.0.2.20:31701
backend vif-2
    server s2 192.0.2.20:31702
backend vif-3
    server s3 192.0.2.20:31703
backend vif-4
    server s4 192.0.2.20:31704
backend vif-5
    server s5 192.0.2.20:31705
backend vif-6
    server s6 192.0.2.20:31706
backend vif-7
    server s7 192.0.2.20:31707
backend vif-8
    server s8 192.0.2.20:31708
backend vif-9
    server s9 192.0.2.20:31709

# No server, so a name the map does not hold is closed here rather than sent to
# whichever session happens to be first. A player whose link expired sees the
# connection end; the map is where an operator looks.
backend vif-unrouted
