<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'">
  <title>Vi-Fighter Fleet Logs</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.4 ui-monospace, monospace; background: #0b0e14; color: #d8dee9; }
    body { margin: 0; }
    header { position: sticky; top: 0; z-index: 2; padding: 12px; background: #111722; border-bottom: 1px solid #303848; }
    h1 { display: inline; margin: 0 18px 0 0; font-size: 16px; }
    .controls { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, button { padding: 5px 8px; border: 1px solid #465064; border-radius: 4px; background: #171e2b; color: inherit; font: inherit; }
    input[type=url] { width: 330px; }
    button { cursor: pointer; }
    button:hover { background: #253047; }
    #state { padding: 3px 7px; border-radius: 999px; background: #384152; }
    #state.live { background: #1d5738; }
    #state.retrying { background: #795c16; }
    #state.failed { background: #7b2936; }
    #stats { margin-top: 8px; color: #9aa6b7; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { position: sticky; top: 92px; z-index: 1; background: #151b26; color: #9aa6b7; text-align: left; }
    th, td { padding: 5px 8px; border-bottom: 1px solid #202838; vertical-align: top; overflow-wrap: anywhere; }
    th:nth-child(1), td:nth-child(1) { width: 185px; }
    th:nth-child(2), td:nth-child(2) { width: 58px; }
    th:nth-child(3), td:nth-child(3) { width: 145px; }
    th:nth-child(4), td:nth-child(4) { width: 75px; }
    tr:hover { background: #121a28; }
    tr[data-level=ERROR], tr[data-level=FATAL] { color: #ff8796; }
    tr[data-level=WARN] { color: #ffd479; }
    tr[data-level=INFO] { color: #a9c7ff; }
    details summary { cursor: pointer; }
    pre { white-space: pre-wrap; margin: 6px 0 0; color: #bac4d3; }
  </style>
</head>
<body>
  <header>
    <h1>Vi-Fighter fleet logs</h1>
    <div class="controls">
      <label>Stream <input id="url" type="text" value="/vif/api/logs"></label>
      <button id="connect" type="button">Connect</button>
      <button id="pause" type="button">Pause</button>
      <button id="clear" type="button">Clear</button>
      <label>Session <input id="session" placeholder="all sessions"></label>
      <label>Level
        <select id="level">
          <option value="">all</option>
          <option>TRACE</option><option>DEBUG</option><option>INFO</option>
          <option>PROC</option><option>WARN</option><option>ERROR</option><option>FATAL</option>
        </select>
      </label>
      <span id="state">idle</span>
    </div>
    <div id="stats">rows 0 · duplicates 0 · UI drops 0</div>
  </header>
  <table aria-live="polite">
    <thead><tr><th>time</th><th>level</th><th>session</th><th>sub</th><th>message / record</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    'use strict';
    const rowLimit = 1000;
    const queueLimit = 2000;
    const fingerprintLimit = 4096;
    const renderBatch = 80;
    const rows = document.querySelector('#rows');
    const state = document.querySelector('#state');
    const stats = document.querySelector('#stats');
    const pauseButton = document.querySelector('#pause');
    const queue = [];
    const fingerprints = new Map();
    let source = null;
    let paused = false;
    let duplicates = 0;
    let uiDrops = 0;

    function setState(label, kind = '') {
      state.textContent = label;
      state.className = kind;
    }
    function updateStats() {
      stats.textContent = `rows ${rows.children.length} · queued ${queue.length} · duplicates ${duplicates} · UI drops ${uiDrops}`;
    }
    function remember(raw) {
      if (fingerprints.has(raw)) return false;
      fingerprints.set(raw, true);
      if (fingerprints.size > fingerprintLimit) fingerprints.delete(fingerprints.keys().next().value);
      return true;
    }
    function append(record, raw) {
      const session = record?.fields?.session_id ?? '';
      const level = record?.level ?? '';
      if (document.querySelector('#session').value && session !== document.querySelector('#session').value) return;
      if (document.querySelector('#level').value && level !== document.querySelector('#level').value) return;

      const tr = document.createElement('tr');
      tr.dataset.level = level;
      const values = [record?.time ?? '', level, session, record?.sub ?? ''];
      for (const value of values) {
        const td = document.createElement('td');
        td.textContent = String(value);
        tr.append(td);
      }
      const detailCell = document.createElement('td');
      const detail = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = String(record?.fields?.msg ?? record?.msg ?? '(record)');
      const pre = document.createElement('pre');
      pre.textContent = raw;
      detail.append(summary, pre);
      detailCell.append(detail);
      tr.append(detailCell);
      rows.append(tr);
      while (rows.children.length > rowLimit) rows.firstElementChild.remove();
    }
    function render() {
      if (!paused) {
        for (let count = 0; count < renderBatch && queue.length; count++) {
          const raw = queue.shift();
          try { append(JSON.parse(raw), raw); } catch { append({fields: {msg: 'non-JSON event'}}, raw); }
        }
      }
      updateStats();
      requestAnimationFrame(render);
    }
    function disconnect() {
      source?.close();
      source = null;
      document.querySelector('#connect').textContent = 'Connect';
      setState('closed');
    }
    function connect() {
      if (source) { disconnect(); return; }
      source = new EventSource(document.querySelector('#url').value);
      document.querySelector('#connect').textContent = 'Disconnect';
      setState('connecting', 'retrying');
      source.onopen = () => setState('live', 'live');
      source.onerror = () => setState('reconnecting', 'retrying');
      source.addEventListener('connected', event => {
        try {
          const metadata = JSON.parse(event.data);
          setState(`live · client ${metadata.client_id}`, 'live');
        } catch { setState('live', 'live'); }
      });
      source.onmessage = event => {
        if (!remember(event.data)) { duplicates++; return; }
        if (queue.length >= queueLimit) { queue.shift(); uiDrops++; }
        queue.push(event.data);
      };
    }

    document.querySelector('#connect').addEventListener('click', connect);
    document.querySelector('#clear').addEventListener('click', () => {
      rows.replaceChildren(); queue.length = 0; fingerprints.clear(); duplicates = 0; uiDrops = 0; updateStats();
    });
    pauseButton.addEventListener('click', () => {
      paused = !paused; pauseButton.textContent = paused ? 'Resume' : 'Pause';
    });
    window.addEventListener('beforeunload', () => source?.close());
    requestAnimationFrame(render);
  </script>
</body>
</html>
