# Superseded console-source experiment; do not deploy this configuration.
#
# The live fleet still writes stdout and exposes no public stream. Batch E in
# doc/kube-todo.md replaces this console input with one standalone file source;
# LogWisp will not be owned by the allocator or use a Kubernetes credential.
quiet = false
status_reporter = false
auto_reload = false

# Operational output to stderr; Batch E replaces the stdin data path.
[logging]
output = "stderr"
level = "warn"

[[pipelines]]
name = "fleet"

# The console source puts the whole line in the entry message and leaves the
# structured fields empty, and `raw` emits that message unchanged. Every key
# vi-fighter wrote — sub, run, tick, frame — survives.
[pipelines.flow.format]
type = "raw"
sanitizer_policy = "raw"

# One session at 10 Hz emits a snapshot record per visible group; ten of them is a
# stream no browser panel needs in full. Drop rather than pass, so the cap holds.
[pipelines.flow.rate_limit]
rate = 400.0
burst = 800.0
policy = "drop"
max_entry_size_bytes = 65536

# Filters match "<source> <level> <message>", and the message here is the whole
# JSON line, so the envelope this pipeline never parses is still selectable.
[[pipelines.flow.filters]]
type = "exclude"
logic = "or"
patterns = ["\"level\":\"TRACE\""]

[[pipelines.plugin_sources]]
id = "fleet"
type = "console"
[pipelines.plugin_sources.config]
buffer_size = 4096

# Loopback only. Batch F makes the allocator a byte proxy after this service is
# independently deployed and verified.
[[pipelines.plugin_sinks]]
id = "stream"
type = "http"
[pipelines.plugin_sinks.config]
host = "127.0.0.1"
port = 8081
stream_path = "/stream"
status_path = "/status"
max_connections = 32
client_buffer_size = 512
write_timeout_ms = 5000
