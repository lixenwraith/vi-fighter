#!/usr/bin/nft -f
# Guest filter for the K3s node: owns table inet vif and nothing else (doc/kube_docker_deploy.md §6).
# Never add `flush ruleset`: K3s, kube-router and flannel program iptables-nft tables beside this one.
include "/etc/nftables.d/vif-operator.nft"

# Create-then-delete makes every load, including the first, a replacement of this table only.
table inet vif
delete table inet vif

table inet vif {
	chain input {
		# After the iptables-nft tables, so kube-proxy and kube-router verdicts are seen first regardless of load order.
		type filter hook input priority filter + 10; policy drop;

		ct state { established, related } accept
		ct state invalid drop
		iif lo accept

		# Pods, flannel and the Docker build bridge reach node services such as the API server.
		iifname { "cni0", "flannel.1", "docker0" } accept
		ip saddr { 10.42.0.0/16, 10.43.0.0/16 } accept

		meta l4proto { icmp, ipv6-icmp } accept

		# Operator SSH only; 6443 does not leave the guest (A10).
		ip saddr $operator_addr tcp dport $sshd_port accept
	}

	chain forward {
		# NodePort traffic is DNATed in prerouting and admitted here, never in input.
		type filter hook forward priority filter; policy accept;
	}
}
