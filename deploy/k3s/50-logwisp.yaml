# The log sidecar's configuration, for the H9 in-pod experiment only.
#
# LogWisp (github.com/lixenwraith/logwisp) tails a directory of JSON lines and
# serves them as Server-Sent Events. A sidecar rather than a second listener in
# vif, and a session's metrics ride the same stream because internal/status emits
# the whole registry into the log.
#
# What the deployment actually runs is the node-level fan-in in
# deploy/logwisp/aggregator.toml: the file source below cannot carry vi-fighter's
# envelope intact and the pod log can. See doc/kube_docker_deploy.md §10.3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vif-logwisp
  namespace: vif
  labels:
    app.kubernetes.io/name: vi-fighter
    app.kubernetes.io/component: logs
data:
  logwisp.toml: |
    # One pipeline: the session's log directory in, two sinks out.
    quiet = false
    status_reporter = false
    auto_reload = false

    [logging]
    output = "stderr"
    level = "warn"

    [[pipelines]]
    name = "session"

    # The file source unmarshals every valid JSON object into LogWisp's narrower
    # envelope, keeping only time, level, top-level msg and fields — so sub, run,
    # tick and frame are gone before the formatter runs, and `raw` cannot restore
    # them. JSON is therefore the honest setting here; H9 is the fix.
    [pipelines.flow.format]
    type = "json"

    # Containers do not share stdout, so a console source cannot consume the
    # session container's; inside the pod the read-only shared file is the only
    # hand-off there is.
    [[pipelines.plugin_sources]]
    id = "vif"
    type = "file"
    [pipelines.plugin_sources.config]
    directory = "/var/log/vif"
    pattern = "vif-log-*.jsonl"
    check_interval_ms = 100

    # The container's stdout carries normalized events for `kubectl logs`; the
    # session writes the source JSONL to the shared file instead.
    [[pipelines.plugin_sinks]]
    id = "stdout"
    type = "console"
    [pipelines.plugin_sinks.config]
    target = "stdout"

    # Server-Sent Events on 8080, cluster-internal. Both endpoints are
    # unauthenticated and the stream sends Access-Control-Allow-Origin: *, so the
    # NetworkPolicy in 20-networkpolicy.yaml is what keeps it off the player path
    # — treat it exactly like the probe port.
    [[pipelines.plugin_sinks]]
    id = "stream"
    type = "http"
    [pipelines.plugin_sinks.config]
    host = "0.0.0.0"
    port = 8080
    stream_path = "/stream"
    status_path = "/status"
    max_connections = 8

    # There is no file sink and internal logs go to stderr. This pipeline opens
    # the mounted log directory only for reading and needs no writable path.
