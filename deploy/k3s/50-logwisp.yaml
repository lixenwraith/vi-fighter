# Obsolete in-pod experiment; do not apply this ConfigMap.
#
# The selected fleet uses one standalone node service after the shared writer and
# storage path pass. Batch C removes this file with the remaining sidecar shape;
# see doc/kube-todo.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vif-logwisp
  namespace: vif
  labels:
    app.kubernetes.io/name: vi-fighter
    app.kubernetes.io/component: logs
data:
  logwisp.toml: |
    # One pipeline: the session's log directory in, two sinks out.
    quiet = false
    status_reporter = false
    auto_reload = false

    [logging]
    output = "stderr"
    level = "warn"

    [[pipelines]]
    name = "session"

    # raw = true below leaves the line unparsed, and this leaves it unformatted:
    # every key vi-fighter wrote reaches both sinks byte for byte.
    [pipelines.flow.format]
    type = "raw"
    sanitizer_policy = "raw"

    # Containers do not share stdout, so a console source cannot consume the
    # session container's; inside the pod the read-only shared file is the only
    # hand-off there is.
    [[pipelines.plugin_sources]]
    id = "vif"
    type = "file"
    [pipelines.plugin_sources.config]
    directory = "/var/log/vif"
    pattern = "vif-log-*.jsonl"
    check_interval_ms = 100
    # The session writes before the watcher attaches, so a file discovered with
    # content already in it is read whole rather than from its end.
    raw = true
    from = "start"

    # The container's stdout carries normalized events for `kubectl logs`; the
    # session writes the source JSONL to the shared file instead.
    [[pipelines.plugin_sinks]]
    id = "stdout"
    type = "console"
    [pipelines.plugin_sinks.config]
    target = "stdout"

    # Server-Sent Events on 8080, cluster-internal. Both endpoints are
    # unauthenticated and the stream sends Access-Control-Allow-Origin: *, so the
    # NetworkPolicy in 20-networkpolicy.yaml is what keeps it off the player path
    # — treat it exactly like the probe port.
    [[pipelines.plugin_sinks]]
    id = "stream"
    type = "http"
    [pipelines.plugin_sinks.config]
    host = "0.0.0.0"
    port = 8080
    stream_path = "/stream"
    status_path = "/status"
    max_connections = 8

    # There is no file sink and internal logs go to stderr. This pipeline opens
    # the mounted log directory only for reading and needs no writable path.
