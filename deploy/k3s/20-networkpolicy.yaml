# What a session pod may talk to, and what may talk to it.
#
# K3s enforces NetworkPolicy through its bundled kube-router controller unless the
# cluster was installed with --disable-network-policy. Verify that before trusting
# these: a policy the CNI does not enforce is a comment, and this one is load
# bearing — every connected peer can influence the shared simulation, so a session
# pod is a piece of attack surface reachable by whoever can reach the game port.
---
# Default deny, both directions, for everything in the namespace. Every allowance
# below is additive to this; anything not named is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vif
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The game port, from anywhere.
#
# Player traffic arrives through a NodePort from an address no pod or namespace
# selector can identify, so this policy cannot authenticate a player. It is not
# trying to. externalTrafficPolicy keeps the original source for the application.
# What it does is confine the reachable surface to one port on one workload, so
# that everything else in the namespace stays unreachable even from a source that
# is allowed to play. Restricting *who* may reach 7777 is the firewall's job on the
# FreeBSD host and the node; see doc/kube-docker-deploy.md §2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-ingress
  namespace: vif
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vif
      app.kubernetes.io/component: session
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: game
# The browser bridge port has no rule, deliberately.
#
# 7779 is named by no Service and forwarded by no firewall, and the default deny
# above refuses it to every pod — the namespace has no egress, so a session cannot
# dial its neighbour's bridge either. The node's allocator reaches it by whatever
# already carries its /health probe past a rule admitting only monitoring, and a
# rule for 7779 could not be narrower: no selector expresses "the node", so it
# would have to omit `from` and thereby admit every pod in the cluster.
#
# Prove that rather than believe it: §13 of doc/kube-docker-deploy.md is where the
# check lives, against a live session. If node-to-pod turns out to be filtered, the
# narrow fix is the address the node reaches pods from, which `ip route get <a
# session pod IP>` prints as `src`, as an ipBlock on port wsgame.
---
# The operator ports, from the monitoring namespace only.
#
# /health and /metrics describe the session's roster, tick and remaining lifetime,
# and the log stream carries every line the session writes — including the metric
# records. All of it is operational data, all of it is unauthenticated, and none of
# it may be reachable from the player-facing path. The kubelet's own probes bypass
# the pod network and are unaffected by this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-ports
  namespace: vif
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vif
      app.kubernetes.io/component: session
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: probe
        - protocol: TCP
          port: logstream
# No egress allowance is defined, deliberately. A session binds two listeners and
# accepts; it resolves no name, dials nothing, and reads no external resource, so
# the default deny above costs it nothing. If a future feature does need to dial
# out, DNS to kube-system is the first rule to add — and adding it should be a
# decision somebody made, not a rule that was already there.
